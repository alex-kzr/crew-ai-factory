name: caf

services:
  postgres:
    profiles: [core]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caf
      POSTGRES_USER: caf
      POSTGRES_PASSWORD: ${CAF_POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U caf -d caf"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    mem_limit: 512m

  control-api:
    profiles: [core]
    build:
      context: ../../repositories/caf-control-api
    environment:
      CAF_DATABASE_URL: postgresql://caf:${CAF_POSTGRES_PASSWORD:-}@postgres:5432/caf
      CAF_API_TOKEN: ${CAF_API_TOKEN:-}
    ports:
      - 127.0.0.1:${CAF_API_PORT:-8123}:8000
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private, edge]
    healthcheck:
      test: [CMD, .venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    mem_limit: 512m

  synthetic-worker:
    profiles: [p0-test]
    build:
      context: ../../repositories/caf-orchestration-worker
    environment:
      CAF_QUEUE_TEST_DATABASE_URL: postgresql://caf:${CAF_POSTGRES_PASSWORD:-}@postgres:5432/caf_queue_test_p0_20261013_1
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    restart: "no"
    mem_limit: 512m

  synthetic-worker-daemon:
    profiles: [p0-test-daemon]
    build:
      context: ../../repositories/caf-orchestration-worker
    command: [.venv/bin/python, -m, caf_orchestration_worker.synthetic_daemon]
    environment:
      CAF_QUEUE_TEST_DATABASE_URL: postgresql://caf_test:${CAF_P0_TEST_PASSWORD:-}@p0-test-postgres:5432/caf_queue_test_code
    depends_on:
      p0-test-postgres:
        condition: service_healthy
    networks: [edge]
    restart: unless-stopped
    healthcheck:
      test: [CMD, .venv/bin/python, -c, "import os,time; p='/tmp/caf-synthetic-worker-heartbeat'; assert os.path.isfile(p) and time.time()-os.path.getmtime(p)<15"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s
    mem_limit: 512m

  p0-test-postgres:
    profiles: [p0-code-test, p0-test-daemon]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caf_queue_test_code
      POSTGRES_USER: caf_test
      POSTGRES_PASSWORD: ${CAF_P0_TEST_PASSWORD:-}
    ports:
      - 127.0.0.1:${CAF_P0_TEST_PORT:-55433}:5432
    volumes:
      - p0_test_data:/var/lib/postgresql/data
    networks: [edge]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U caf_test -d caf_queue_test_code"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: "no"
    mem_limit: 512m

volumes:
  postgres_data:
  p0_test_data:

networks:
  private:
    internal: true
  edge: {}
